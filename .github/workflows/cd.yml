name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version, e.g. 3.2.3 or 3.2.3-beta.1 (without v)'
        required: true
        type: string
      minecraft_versions:
        description: 'Comma-separated Minecraft versions tested on Paper and Folia, e.g. 26.1.1, 26.1.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERSION_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'

jobs:
  create_release:
    name: Build and create GitHub release
    if: github.repository == 'atlasgong/InvisibleItemFramesLite' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MINECRAFT_VERSIONS: ${{ inputs.minecraft_versions }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow on the default branch ($DEFAULT_BRANCH)." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ $VERSION_PATTERN ]]; then
            echo 'Use a version such as 3.2.3, 3.2.3-alpha.1, 3.2.3-beta.1, or 3.2.3-rc.1.' >&2
            exit 1
          fi

          jq -en --arg versions "$MINECRAFT_VERSIONS" '
            ($versions | split(",") | map(gsub("^\\s+|\\s+$"; "")) | unique) as $list
            | if ($list | length > 0 and all(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$")))
              then {minecraft_versions: $list}
              else error("Enter exact Minecraft versions as a comma-separated list, e.g. 26.1.1, 26.1.2")
              end
          ' > "$RUNNER_TEMP/release-metadata.json"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the versioned JAR and run tests
        run: ./gradlew clean build "-PreleaseVersion=$VERSION"

      - name: Create tag and publish release with both assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          jar="build/libs/InvisibleItemFramesLite-$VERSION.jar"
          test -s "$jar"

          # Compare the commit behind both lightweight and annotated tags.
          remote_refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          tag_commit=$(awk 'END { print $1 }' <<< "$remote_refs")
          if [[ -z "$tag_commit" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          elif [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag already points at a different commit." >&2
            exit 1
          fi

          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$tag" "$jar" "$RUNNER_TEMP/release-metadata.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes "${flags[@]}"

  publish:
    name: Publish to ${{ matrix.site }}
    needs: create_release
    if: >-
      ${{ !cancelled() && github.repository == 'atlasgong/InvisibleItemFramesLite' &&
          (github.event_name == 'release' || needs.create_release.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [ Modrinth, Hangar ]
    steps:
      - name: Download the published GitHub release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          version=${TAG#v}
          if [[ "$TAG" != "v$version" || ! "$version" =~ $VERSION_PATTERN ]]; then
            echo 'The release tag must be vMAJOR.MINOR.PATCH with an optional -alpha.N, -beta.N, or -rc.N suffix.' >&2
            exit 1
          fi

          case "$version" in
            *-alpha.*) modrinth_channel=alpha; hangar_channel=Alpha; prerelease=true ;;
            *-beta.*) modrinth_channel=beta; hangar_channel=Beta; prerelease=true ;;
            *-rc.*) modrinth_channel=beta; hangar_channel=RC; prerelease=true ;;
            *) modrinth_channel=release; hangar_channel=Release; prerelease=false ;;
          esac

          release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease)
          if ! jq -e --argjson prerelease "$prerelease" \
              '.isDraft == false and .isPrerelease == $prerelease' <<< "$release" > /dev/null; then
            echo 'The release must be published and its prerelease setting must agree with the tag.' >&2
            exit 1
          fi
          url=$(jq -er '.url' <<< "$release")
          jar="InvisibleItemFramesLite-$version.jar"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$jar" --pattern release-metadata.json
          if [[ ! -s "$jar" || ! -s release-metadata.json ]]; then
            echo "The GitHub release must contain $jar and release-metadata.json." >&2
            exit 1
          fi
          if ! versions=$(jq -ce '
            .minecraft_versions
            | select(type == "array" and length > 0)
            | select(all(type == "string" and test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$")))
            | unique
          ' release-metadata.json); then
            echo 'release-metadata.json must contain a nonempty minecraft_versions array of exact version strings.' >&2
            exit 1
          fi

          plugin_descriptor=$(unzip -p "$jar" plugin.yml)
          if ! grep -Fxq "version: $version" <<< "$plugin_descriptor" ||
             ! grep -Fxq 'folia-supported: true' <<< "$plugin_descriptor"; then
            echo "The JAR's plugin.yml must declare version $version and Folia support." >&2
            exit 1
          fi

          {
            echo "jar=$jar"
            echo "version=$version"
            echo "minecraft_versions=$versions"
            echo "modrinth_channel=$modrinth_channel"
            echo "hangar_channel=$hangar_channel"
            printf 'changelog=See the release notes on GitHub: [%s](%s).\n' "$TAG" "$url"
          } >> "$GITHUB_OUTPUT"

      - name: Publish version and sync project page on ${{ matrix.site }}
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
          MODRINTH_TOKEN: ${{ matrix.site == 'Modrinth' && secrets.MODRINTH_TOKEN || '' }}
          HANGAR_API_TOKEN: ${{ matrix.site == 'Hangar' && secrets.HANGAR_API_TOKEN || '' }}
          JAR: ${{ steps.release.outputs.jar }}
          VERSION: ${{ steps.release.outputs.version }}
          MINECRAFT_VERSIONS: ${{ steps.release.outputs.minecraft_versions }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
          MODRINTH_CHANNEL: ${{ steps.release.outputs.modrinth_channel }}
          HANGAR_CHANNEL: ${{ steps.release.outputs.hangar_channel }}
        run: |
          api=(curl --silent --show-error --connect-timeout 15 --max-time 120 --user-agent "$GITHUB_REPOSITORY/CD")
          lookup_auth=()
          case "$SITE" in
            Modrinth)
              : "${MODRINTH_TOKEN:?Set the MODRINTH_TOKEN Actions secret}"
              project=2BFDqF3g
              project_url="https://api.modrinth.com/v2/project/$project"
              upload_url=https://api.modrinth.com/v2/version
              version_url="$project_url/version/$VERSION"
              page_url="$project_url"
              page_field=body
              channel=$MODRINTH_CHANNEL
              payload_field=data
              file_field=jar
              auth="Authorization: $MODRINTH_TOKEN"
              hash=$(sha512sum "$JAR" | cut -d ' ' -f 1)
              payload=$(jq -n --arg id "$project" --arg version "$VERSION" \
                --arg channel "$channel" --arg changelog "$CHANGELOG" --argjson versions "$MINECRAFT_VERSIONS" '
                {project_id: $id, name: ("v" + $version), version_number: $version, changelog: $changelog,
                 version_type: $channel, game_versions: $versions, loaders: ["paper", "folia"],
                 featured: false, dependencies: [], file_parts: ["jar"], primary_file: "jar"}
              ')
              # shellcheck disable=SC2016
              matches='.version_number == $version and .version_type == $channel and .changelog == $changelog
                and (.game_versions | sort) == $versions and (.loaders | sort) == ["folia", "paper"]
                and any(.files[]; .primary and .hashes.sha512 == $hash)'
              ;;
            Hangar)
              : "${HANGAR_API_TOKEN:?Set the HANGAR_API_TOKEN Actions secret}"
              base=https://hangar.papermc.io/api/v1
              project=InvisibleItemFramesLite
              upload_url="$base/projects/$project/upload"
              version_url="$base/projects/$project/versions/v$VERSION"
              page_url="$base/pages/editmain/$project"
              page_field=content
              channel=$HANGAR_CHANNEL
              payload_field=versionUpload
              file_field=files
              jwt=$("${api[@]}" --fail --request POST --url-query "apiKey=$HANGAR_API_TOKEN" "$base/authenticate" \
                | jq -er '.token | strings | select(length > 0)')
              echo "::add-mask::$jwt"
              auth="Authorization: HangarAuth $jwt"
              lookup_auth=(--header "$auth")
              hash=$(sha256sum "$JAR" | cut -d ' ' -f 1)
              payload=$(jq -n --arg version "v$VERSION" --arg channel "$channel" \
                --arg changelog "$CHANGELOG" --argjson versions "$MINECRAFT_VERSIONS" '
                {version: $version, channel: $channel, description: $changelog,
                 platformDependencies: {PAPER: $versions}, pluginDependencies: {}, files: [{platforms: ["PAPER"]}]}
              ')
              # shellcheck disable=SC2016
              matches='.name == ("v" + $version) and .channel.name == $channel and .description == $changelog
                and (.platformDependencies.PAPER | sort) == $versions and .downloads.PAPER.fileInfo.sha256Hash == $hash'
              ;;
          esac

          response="$RUNNER_TEMP/existing-version.json"
          status=$("${api[@]}" "${lookup_auth[@]}" --output "$response" --write-out '%{http_code}' "$version_url")
          case "$status" in
            200)
              if jq -e --arg hash "$hash" --arg version "$VERSION" --arg channel "$channel" \
                  --arg changelog "$CHANGELOG" --argjson versions "$MINECRAFT_VERSIONS" "$matches" "$response" > /dev/null; then
                echo "$SITE already has this release and the JAR matches."
              else
                echo "$SITE already has version $VERSION with different metadata or a different JAR." >&2
                exit 1
              fi
              ;;
            404)
              printf '%s\n' "$payload" > "$RUNNER_TEMP/upload-metadata.json"
              "${api[@]}" --fail-with-body --header "$auth" \
                --form "$payload_field=<$RUNNER_TEMP/upload-metadata.json;type=application/json" \
                --form "$file_field=@$JAR;type=application/java-archive" "$upload_url"
              ;;
            *) echo "$SITE version lookup failed with HTTP $status." >&2; exit 1 ;;
          esac

          readme="$RUNNER_TEMP/README.md"
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/README.md" \
            --header 'Accept: application/vnd.github.raw+json' --raw-field "ref=$GITHUB_SHA" > "$readme"
          if ! grep -q '[^[:space:]]' "$readme"; then
            echo 'README.md at the release commit is empty.' >&2
            exit 1
          fi

          printf '\nSyncing the %s project page from README.md.\n' "$SITE"
          jq -n --arg field "$page_field" --rawfile markdown "$readme" '{($field): $markdown}' \
            | "${api[@]}" --fail-with-body --request PATCH --header "$auth" \
                --header 'Content-Type: application/json' --data-binary @- "$page_url"
